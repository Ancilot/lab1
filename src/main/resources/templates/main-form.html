<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новый студент</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Форма информации о студенте</h1>
<form th:action="@{/form}"
      th:object="${student}"
      method="post">

    <div class="form-group">
        <label for="id">ID</label>
        <input
                type="number"
                id="id"
                th:field="*{id}"
                required>
    </div>

    <div class="form-group">
        <label for="surname">Фамилия</label>
        <input
                type="text"
                id="surname"
                th:field="*{surname}"
                required>
    </div>

    <div class="form-group">
        <label for="name">Имя</label>
        <input
                type="text"
                id="name"
                th:field="*{name}"
                required>
    </div>

    <div class="form-group">
        <label for="patronymic">Отчество</label>
        <input
                type="text"
                id="patronymic"
                th:field="*{patronymic}"
                required>
    </div>

    <div class="form-group">
        <label for="email">E-mail</label>
        <input
                type="email"
                id="email"
                th:field="*{email}"
                required>
    </div>

    <div class="form-group">
        <label for="year">Год поступления</label>
        <input
                type="number"
                id="year"
                th:field="*{year}"
                required>
    </div>

    <div class="buttons">
        <button type="submit">Создать</button>
        <button type="reset" class="reset">Сбросить</button>
    </div>

</form>
</body> </html>
